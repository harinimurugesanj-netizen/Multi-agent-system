[project]
name = "photoagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harini", email = "harinimurugesanj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=0.3.4",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<2.1",
    "structlog>=24.1",
]

[project.scripts]
photoagent = "photoagent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.8",
    "pytest>=9.1.1",
]
